<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFE6F2"/>
      <stop offset="0.55" stop-color="#F9D3DD"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- dark background -->
  <rect width="64" height="64" rx="14" fill="#05040a"/>

  <!-- soft glow -->
  <circle cx="32" cy="32" r="26" fill="url(#g)" opacity="0.18"/>

  <!-- ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#g)" stroke-width="3.5" opacity="0.9"/>

  <!-- monogram -->
  <text x="32" y="40"
        text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="22"
        font-weight="900"
        fill="url(#g)"
        filter="url(#shadow)">SJ</text>
</svg>
