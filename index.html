<!doctype html>
<html lang="cs">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webový životopis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Caveat:wght@600;700&family=League+Spartan:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body data-lang="cs">
  <div class="bg" aria-hidden="true"></div>

  <div class="topbar">
    <div class="topbar__cluster">
      <div class="langToggle" role="group" aria-label="Jazyk / Language">
        <button class="langToggle__btn" type="button" data-lang="cs" aria-label="Čeština">
          <span class="flag">🇨🇿</span><span class="code">CZ</span>
        </button>
        <button class="langToggle__btn" type="button" data-lang="en" aria-label="English">
          <span class="flag">🇬🇧</span><span class="code">ENG</span>
        </button>
        <span class="langToggle__thumb" aria-hidden="true"></span>
      </div>

      <!-- PDF button (otevře samostatnou stránku s CV – cv.html) -->
      <a class="pdfBtn" href="cv.html" target="_blank" rel="noopener noreferrer" aria-label="Otevřít PDF životopis">
        <span class="pdfBtn__icon" aria-hidden="true">
          <!-- jednoduchá ikona dokumentu -->
          <svg viewBox="0 0 24 24">
            <path d="M7 2h7l5 5v15a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V8h4.5L14 3.5z"/>
            <path d="M8 12h8v1.6H8V12zm0 3h8v1.6H8V15zm0 3h6v1.6H8V18z"/>
          </svg>
        </span>
        <span class="pdfBtn__text" data-i18n="pdfBtn">PDF</span>
      </a>
    </div>
  </div>

  <div class="cursorTip" id="cursorTip" aria-hidden="true">Otevřít</div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox__backdrop" data-close></div>
    <div class="lightbox__panel" role="dialog" aria-modal="true" aria-label="Detail">
      <button class="lightbox__close" type="button" aria-label="Zavřít" data-close>×</button>
      <div class="lightbox__content">
        <div class="lightbox__imageWrap">
          <img class="lightbox__img" id="lightboxImg" src="" alt="">
        </div>
        <aside class="lightbox__info">
          <h3 class="lightbox__title" id="lightboxTitle"></h3>
          <div class="lightbox__meta" id="lightboxMeta"></div>
          <p class="lightbox__desc" id="lightboxDesc"></p>
          <ul class="lightbox__list" id="lightboxList"></ul>
        </aside>
      </div>
    </div>
  </div>

  <main class="wrap">
    <header class="hero">
      <h1 class="hero__name">Sebastian JAREŠ</h1>
      <div class="hero__role" data-i18n="role">L&D specialista</div>
    </header>

    <section class="orbit" aria-label="Rychlé menu">
      <div class="orbit__photo" aria-label="Profilová fotografie">
        <img src="assets/thumbnail_IMG_6727.jpg" alt="Profilová fotografie" />
      </div>

      <svg class="orbit__arc" viewBox="0 0 420 420" aria-hidden="true">
        <path class="orbit__arcBase" d="M 210 20 A 190 190 0 0 1 210 400" />
        <path class="orbit__arcFill" d="M 210 20 A 190 190 0 0 1 210 400" />
        <circle class="orbit__arcDot orbit__arcDot--top" cx="210" cy="20" r="7"></circle>
        <circle class="orbit__arcDot orbit__arcDot--bottom" cx="210" cy="400" r="7"></circle>
      </svg>

      <nav class="orbit__items" aria-label="Menu ikon">
        <a class="orbit__item" href="#contact" data-label="+420 604 927 265" aria-label="Telefon">
          <span class="orbit__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.5 3 3.6 5.1 6.6 6.6l2.2-2.2c.3-.3.8-.4 1.2-.2 1 .4 2 .6 3.1.6.7 0 1.3.6 1.3 1.3V21c0 .7-.6 1.3-1.3 1.3C10.3 22.3 1.7 13.7 1.7 3.3 1.7 2.6 2.3 2 3 2h3.5c.7 0 1.3.6 1.3 1.3 0 1.1.2 2.1.6 3.1.1.4 0 .9-.2 1.2L6.6 10.8z"/></svg>
          </span>
        </a>

        <a class="orbit__item" href="#contact" data-label="sebastianjaresik@gmail.com" aria-label="Email">
          <span class="orbit__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/></svg>
          </span>
        </a>

        <!-- ✅ LinkedIn (upraveno) -->
        <a class="orbit__item" href="https://www.linkedin.com/in/sebastian-jares-994a06221" target="_blank" rel="noopener noreferrer" data-label="LinkedIn" aria-label="LinkedIn">
          <span class="orbit__icon orbit__icon--text" aria-hidden="true">in</span>
        </a>

        <a class="orbit__item" href="#skills" data-label-cs="Pracovní dovednosti" data-label-en="Skills" data-label="Pracovní dovednosti" aria-label="Pracovní dovednosti">
          <span class="orbit__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M14.7 6.3 9.8 11.2l3 3 4.9-4.9c.7-.7.7-1.8 0-2.5l-.5-.5c-.7-.7-1.8-.7-2.5 0z"></path>
              <path d="M8.4 12.6 4 17v3h3l4.4-4.4-3-3z"></path>
              <path d="M19 21H10v-2h9v2z"></path>
            </svg>
          </span>
        </a>

        <a class="orbit__item" href="#work" data-label-cs="Ukázky práce" data-label-en="Work" data-label="Ukázky práce" aria-label="Ukázky práce">
          <span class="orbit__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 21h6v-1H9v1z"></path>
              <path d="M12 2c-3.3 0-6 2.7-6 6 0 2.2 1.2 4.1 3 5.2V16c0 .6.4 1 1 1h4c.6 0 1-.4 1-1v-2.8c1.8-1.1 3-3 3-5.2 0-3.3-2.7-6-6-6zm2.7 10.2-.7.4V15h-4v-2.4l-.7-.4C7.9 11.3 7 9.7 7 8c0-2.8 2.2-5 5-5s5 2.2 5 5c0 1.7-.9 3.3-2.3 4.2z"></path>
              <path d="M18.6 12.6l.8-.8.9.9-.8.8.3 1.1h1.1v1.3h-1.1l-.3 1.1.8.8-.9.9-.8-.8-1.1.3v1.1h-1.3v-1.1l-1.1-.3-.8.8-.9-.9.8-.8-.3-1.1H13v-1.3h1.1l.3-1.1-.8-.8.9-.9.8.8 1.1-.3V11h1.3v1.1l1.1.3z"></path>
            </svg>
          </span>
        </a>

        <a class="orbit__item" href="#experience" data-label-cs="Zkušenosti" data-label-en="Experience" data-label="Zkušenosti" aria-label="Zkušenosti">
          <span class="orbit__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M10 2h4c1.1 0 2 .9 2 2v2h4c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V8c0-1.1.9-2 2-2h4V4c0-1.1.9-2 2-2zm4 4V4h-4v2h4z"/></svg>
          </span>
        </a>

        <a class="orbit__item" href="#education" data-label-cs="Vzdělání" data-label-en="Education" data-label="Vzdělání" aria-label="Vzdělání">
          <span class="orbit__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zm0 13L5 12.2V15c0 2.8 3.1 5 7 5s7-2.2 7-5v-2.8L12 16z"/></svg>
          </span>
        </a>
      </nav>
    </section>

    <section class="sectionCard aboutCard reveal" data-reveal id="about" aria-label="O mně">
      <div class="cardHead">
        <h2 class="cardTitle" data-i18n="aboutTitle">O MĚ</h2>
        <div class="cardLine" aria-hidden="true"></div>
      </div>

      <div class="aboutGrid">
        <div class="aboutText">
          <p class="aboutP" data-i18n="aboutP1"></p>
          <p class="aboutP" data-i18n="aboutP2"></p>
        </div>

        <div class="aboutHighlights" aria-label="Zaměření">
          <div class="aboutKicker" data-i18n="aboutKicker">Zaměření</div>
          <ul class="aboutList">
            <li data-i18n="aboutLi1"></li>
            <li data-i18n="aboutLi2"></li>
            <li data-i18n="aboutLi3"></li>
            <li data-i18n="aboutLi4"></li>
            <li data-i18n="aboutLi5"></li>
          </ul>
        </div>
      </div>
    </section>

    <section class="sectionCard skillsCard reveal" data-reveal id="skills" aria-label="Pracovní dovednosti">
      <div class="cardHead">
        <h2 class="cardTitle" data-i18n="skillsTitle">PRACOVNÍ DOVEDNOSTI</h2>
        <div class="cardLine" aria-hidden="true"></div>
      </div>

      <div class="skillsStrip" role="list" aria-label="Loga pracovních dovedností">
        <button class="skillLogo" type="button" data-label="Unitiy engine" aria-label="Unitiy engine">
          <img src="assets/icons/toppng.com-unity-logo-498x512.png" alt="" loading="lazy">
        </button>
        <button class="skillLogo" type="button" data-label="Notion" aria-label="Notion">
          <img src="assets/icons/notion-icon.png" alt="" loading="lazy">
        </button>
        <button class="skillLogo" type="button" data-label="Github" aria-label="Github">
          <img src="assets/icons/github 2.png" alt="" loading="lazy">
        </button>
        <button class="skillLogo" type="button" data-label="Umělá inteligence" aria-label="Umělá inteligence">
          <img src="assets/icons/ai.png" alt="" loading="lazy">
        </button>
        <button class="skillLogo" type="button" data-label="Scriptování / Automatizace" aria-label="Scriptování / Automatizace">
          <img src="assets/icons/script.png" alt="" loading="lazy">
        </button>
        <button class="skillLogo" type="button" data-label="Angličtina (B1+)" aria-label="Angličtina (B1+)">
          <img src="assets/icons/united-kingdom.png" alt="" loading="lazy">
        </button>
        <button class="skillLogo" type="button" data-label="Canva" aria-label="Canva">
          <img src="assets/icons/canva-icon.png" alt="" loading="lazy">
        </button>

        <!-- ✅ Office 365 - teď stejně jako ostatní ikony (tvůj vlastní obrázek) -->
        <button class="skillLogo" type="button" data-label="Office 365" aria-label="Office 365">
          <img src="assets/icons/office-365-icon.png" alt="" loading="lazy">
        </button>
      </div>
    </section>

    <section class="work" id="work" aria-label="Ukázky práce">
      <div class="work__head">
        <h2 class="work__title" data-i18n="workTitle">Ukázky práce</h2>
        <div class="work__note" data-i18n="workNote"></div>
      </div>

      <div class="work__list">

        <article class="workRow reveal" data-reveal data-work="w1">
          <button class="workMedia" type="button" data-work="w1" aria-label="Otevřít" data-img="assets/work/01-social.jpg">
            <img src="assets/work/prace.png" alt="" loading="lazy">
          </button>
          <div class="workText" data-work="w1">
            <div class="workKicker"></div>
            <h3 class="workH"></h3>
            <p class="workP"></p>
            <div class="workTags"></div>
          </div>
        </article>

        <div class="workTrail" data-trail aria-hidden="true">
          <svg viewBox="0 0 600 120" preserveAspectRatio="none">
            <defs>
              <linearGradient id="trailGrad1" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="rgba(191,230,242,0.35)"/>
                <stop offset="0.5" stop-color="rgba(244,179,198,0.65)"/>
                <stop offset="1" stop-color="rgba(244,179,198,0.20)"/>
              </linearGradient>
            </defs>
            <path d="M10,90 C120,10 240,110 360,40 C460,-5 520,65 590,30" />
          </svg>
        </div>

        <article class="workRow workRow--reverse reveal" data-reveal data-work="w2">
          <button class="workMedia" type="button" data-work="w2" aria-label="Otevřít" data-img="assets/work/02-fagota.jpg">
             <img src="assets/work/komiks_trailer_kolaz.png" alt="" loading="lazy">
          </button>
          <div class="workText" data-work="w2">
            <div class="workKicker"></div>
            <h3 class="workH"></h3>
            <p class="workP"></p>
            <div class="workTags"></div>
          </div>
        </article>

        <div class="workTrail" data-trail aria-hidden="true">
          <svg viewBox="0 0 600 120" preserveAspectRatio="none">
            <defs>
              <linearGradient id="trailGrad2" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="rgba(244,179,198,0.20)"/>
                <stop offset="0.5" stop-color="rgba(244,179,198,0.65)"/>
                <stop offset="1" stop-color="rgba(191,230,242,0.35)"/>
              </linearGradient>
            </defs>
            <path d="M10,30 C150,95 220,10 340,80 C460,150 510,35 590,90" />
          </svg>
        </div>

        <article class="workRow reveal" data-reveal data-work="w3">
          <button class="workMedia" type="button" data-work="w3" aria-label="Otevřít" data-img="assets/work/03-makame.jpg">
             <img src="assets/work/prezentace.png" alt="" loading="lazy">
          </button>
          <div class="workText" data-work="w3">
            <div class="workKicker"></div>
            <h3 class="workH"></h3>
            <p class="workP"></p>
            <div class="workTags"></div>
          </div>
        </article>

        <div class="workTrail" data-trail aria-hidden="true">
          <svg viewBox="0 0 600 120" preserveAspectRatio="none">
            <defs>
              <linearGradient id="trailGrad3" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="rgba(191,230,242,0.25)"/>
                <stop offset="0.5" stop-color="rgba(244,179,198,0.60)"/>
                <stop offset="1" stop-color="rgba(244,179,198,0.25)"/>
              </linearGradient>
            </defs>
            <path d="M10,70 C120,5 250,125 360,55 C450,0 520,110 590,55" />
          </svg>
        </div>

        <article class="workRow workRow--reverse reveal" data-reveal data-work="w4">
          <button class="workMedia" type="button" data-work="w4" aria-label="Otevřít" data-img="assets/work/04-laurent.jpg">
             <img src="assets/work/web.png" alt="" loading="lazy">
          </button>
          <div class="workText" data-work="w4">
            <div class="workKicker"></div>
            <h3 class="workH"></h3>
            <p class="workP"></p>
            <div class="workTags"></div>
          </div>
        </article>
      </div>
    </section>

    <section class="xp" id="experience" aria-label="Zkušenosti">
      <div class="xp__head">
        <h2 class="xp__title" data-i18n="xpTitle">Zkušenosti</h2>
        <div class="xp__note" data-i18n="xpNote"></div>
      </div>
      <div class="xp__list" id="xpList"></div>
    </section>

    <section class="sectionCard reveal" data-reveal id="education">
      <div class="eduHead">
        <h2 data-i18n="eduTitle">Vzdělání</h2>
      </div>
      <div class="eduList" id="eduList"></div>
    </section>

    <section class="sectionCard reveal" data-reveal id="contact">
      <h2 data-i18n="contactTitle">Kontakt</h2>
      <div class="contact">
        <div class="contact__row">
          <span class="contact__label" data-i18n="phoneLabel">Telefon</span>
          <span class="contact__value">+420 604 927 265</span>
        </div>
        <div class="contact__row">
          <span class="contact__label" data-i18n="emailLabel">Email</span>
          <span class="contact__value">sebastianjaresik@gmail.com</span>
        </div>
        <div class="contact__row">
          <span class="contact__label">LinkedIn</span>
          <!-- ✅ LinkedIn (upraveno) -->
          <a class="contact__link" href="https://www.linkedin.com/in/sebastian-jares-994a06221" target="_blank" rel="noopener noreferrer" data-i18n="linkedinOpen">Otevřít profil</a>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>© <span id="year"></span> Sebastian Jareš</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
